name: PHP Code Syntax Check

on:
  push:
    branches: [ "dev", "feat/**" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  lint:
    name: Lint PHP Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
            php-version: '8.2'

      - name: Run PHP Linter
        run: |
          echo "Memeriksa sintaks file PHP..."
          find . -name "*.php" -print0 | xargs -0 -n 1 php -l